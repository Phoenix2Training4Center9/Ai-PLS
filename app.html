<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI PLS — لوحة التحكم</title>

  <meta
    name="description"
    content="AI PLS — لوحة التحكم الذكية للتعلم الشخصي."
  >

  <!-- =========================
       FONTS
  ========================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       DESIGN SYSTEM
    ===================================================== */

    :root {

      --bg: #070b17;
      --bg-soft: #0b1020;

      --surface: rgba(17, 24, 39, 0.72);
      --surface-solid: #111827;
      --surface-light: #172033;

      --primary: #6366f1;
      --primary-dark: #4f46e5;

      --cyan: #22d3ee;

      --text: #f8fafc;
      --text-soft: #cbd5e1;
      --muted: #94a3b8;

      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;

      --border: rgba(148, 163, 184, 0.14);

      --gradient:
        linear-gradient(
          135deg,
          #6366f1 0%,
          #22d3ee 100%
        );

      --shadow:
        0 24px 80px rgba(0, 0, 0, 0.35);

      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 26px;

      --sidebar-width: 260px;
    }


    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      font-family:
        "Cairo",
        "IBM Plex Sans Arabic",
        sans-serif;

      background:

        radial-gradient(
          circle at 80% 0%,
          rgba(99, 102, 241, 0.12),
          transparent 28%
        ),

        radial-gradient(
          circle at 10% 30%,
          rgba(34, 211, 238, 0.06),
          transparent 25%
        ),

        var(--bg);

      color: var(--text);

      min-height: 100vh;

      overflow-x: hidden;
    }

    button,
    input,
    textarea,
    select {

      font-family: inherit;
    }

    button {
      border: none;
    }

    a {
      text-decoration: none;
      color: inherit;
    }


    /* =====================================================
       APP LAYOUT
    ===================================================== */

    .app {

      min-height: 100vh;

      display: flex;
    }


    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar {

      width: var(--sidebar-width);

      min-height: 100vh;

      position: fixed;

      right: 0;
      top: 0;

      padding: 22px 16px;

      background:
        rgba(8, 13, 27, 0.88);

      border-left:
        1px solid var(--border);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      z-index: 100;

      display: flex;
      flex-direction: column;
    }


    /* BRAND */

    .sidebar-brand {

      display: flex;

      align-items: center;

      gap: 11px;

      padding:
        4px 8px 25px;
    }

    .brand-icon {

      width: 42px;
      height: 42px;

      display: grid;

      place-items: center;

      border-radius: 13px;

      background: var(--gradient);

      box-shadow:
        0 10px 30px
        rgba(99, 102, 241, 0.28);

      font-size: 19px;

      font-weight: 800;
    }

    .brand-info strong {

      display: block;

      font-size: 17px;

      font-weight: 800;
    }

    .brand-info span {

      display: block;

      color: var(--muted);

      font-size: 10px;

      margin-top: 1px;
    }


    /* SIDEBAR LABEL */

    .menu-label {

      color: #64748b;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 1px;

      padding:
        0 12px 9px;
    }


    /* NAVIGATION */

    .sidebar-nav {

      display: flex;

      flex-direction: column;

      gap: 5px;
    }

    .nav-item {

      width: 100%;

      display: flex;

      align-items: center;

      gap: 12px;

      padding:
        11px 12px;

      border-radius: 13px;

      color: var(--muted);

      font-size: 13px;

      cursor: pointer;

      transition: 0.25s ease;

      background: transparent;
    }

    .nav-item:hover {

      color: var(--text);

      background:
        rgba(255,255,255,0.045);
    }

    .nav-item.active {

      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(99,102,241,0.20),
          rgba(34,211,238,0.07)
        );

      border:
        1px solid
        rgba(99,102,241,0.20);
    }

    .nav-icon {

      width: 34px;
      height: 34px;

      display: grid;

      place-items: center;

      border-radius: 10px;

      background:
        rgba(255,255,255,0.035);

      font-size: 16px;
    }

    .nav-item.active .nav-icon {

      background:
        rgba(99,102,241,0.18);
    }


    /* SIDEBAR BOTTOM */

    .sidebar-bottom {

      margin-top: auto;
    }


    /* PRO CARD */

    .upgrade-card {

      padding: 16px;

      border-radius: 17px;

      background:

        radial-gradient(
          circle at 80% 0%,
          rgba(34,211,238,0.12),
          transparent 45%
        ),

        rgba(255,255,255,0.035);

      border:
        1px solid var(--border);

      margin-bottom: 12px;
    }

    .upgrade-icon {

      width: 34px;
      height: 34px;

      display: grid;

      place-items: center;

      border-radius: 10px;

      background:
        rgba(99,102,241,0.15);

      margin-bottom: 10px;
    }

    .upgrade-card strong {

      display: block;

      font-size: 13px;

      margin-bottom: 5px;
    }

    .upgrade-card p {

      color: var(--muted);

      font-size: 10px;

      line-height: 1.7;

      margin-bottom: 12px;
    }

    .upgrade-btn {

      width: 100%;

      padding: 9px;

      border-radius: 10px;

      color: white;

      background: var(--gradient);

      cursor: pointer;

      font-size: 11px;

      font-weight: 700;
    }


    /* PROFILE */

    .profile {

      display: flex;

      align-items: center;

      gap: 10px;

      padding:
        11px 9px;

      border-top:
        1px solid var(--border);

      margin-top: 5px;
    }

    .profile-avatar {

      width: 37px;
      height: 37px;

      display: grid;

      place-items: center;

      border-radius: 11px;

      background: var(--gradient);

      font-size: 12px;

      font-weight: 800;
    }

    .profile-info {

      min-width: 0;
    }

    .profile-info strong {

      display: block;

      font-size: 11px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .profile-info span {

      color: var(--muted);

      font-size: 9px;
    }


    /* =====================================================
       MAIN CONTENT
    ===================================================== */

    .main {

      width: calc(100% - var(--sidebar-width));

      margin-right: var(--sidebar-width);

      min-height: 100vh;

      padding: 25px 30px 50px;
    }


    /* =====================================================
       TOPBAR
    ===================================================== */

    .topbar {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 35px;
    }

    .mobile-menu {

      display: none;

      width: 42px;
      height: 42px;

      border-radius: 12px;

      background:
        rgba(255,255,255,0.04);

      border:
        1px solid var(--border);

      color: white;

      cursor: pointer;

      font-size: 19px;
    }

    .topbar-title h1 {

      font-size: 27px;

      letter-spacing: -0.8px;

      margin-bottom: 5px;
    }

    .topbar-title p {

      color: var(--muted);

      font-size: 12px;
    }

    .topbar-actions {

      display: flex;

      align-items: center;

      gap: 9px;
    }

    .icon-btn {

      width: 42px;
      height: 42px;

      display: grid;

      place-items: center;

      border-radius: 12px;

      background:
        rgba(255,255,255,0.035);

      border:
        1px solid var(--border);

      color: var(--text-soft);

      cursor: pointer;

      transition: 0.25s ease;

      position: relative;
    }

    .icon-btn:hover {

      background:
        rgba(255,255,255,0.07);

      color: white;
    }

    .notification-dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--cyan);

      position: absolute;

      top: 8px;
      right: 8px;

      box-shadow:
        0 0 0 3px var(--bg);
    }


    /* =====================================================
       WELCOME CARD
    ===================================================== */

    .welcome {

      position: relative;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 30px;

      padding: 28px 30px;

      border-radius: var(--radius-lg);

      border:
        1px solid var(--border);

      background:

        radial-gradient(
          circle at 85% 50%,
          rgba(99,102,241,0.18),
          transparent 35%
        ),

        linear-gradient(
          135deg,
          rgba(99,102,241,0.08),
          rgba(34,211,238,0.025)
        );

      margin-bottom: 22px;
    }

    .welcome::before {

      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      border-radius: 50%;

      background:
        rgba(34,211,238,0.06);

      filter: blur(35px);

      left: -60px;
      bottom: -80px;
    }

    .welcome-content {

      position: relative;

      z-index: 2;
    }

    .welcome-label {

      color: var(--cyan);

      font-size: 11px;

      font-weight: 700;

      margin-bottom: 8px;
    }

    .welcome h2 {

      font-size: 24px;

      margin-bottom: 7px;
    }

    .welcome p {

      color: var(--text-soft);

      font-size: 12px;

      line-height: 1.8;
    }

    .welcome-btn {

      flex-shrink: 0;

      padding:
        12px 17px;

      border-radius: 12px;

      color: white;

      background: var(--gradient);

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 12px 30px
        rgba(99,102,241,0.20);

      transition: 0.25s ease;
    }

    .welcome-btn:hover {

      transform: translateY(-2px);
    }


    /* =====================================================
       STATS
    ===================================================== */

    .stats-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 13px;

      margin-bottom: 22px;
    }

    .stat-card {

      padding: 19px;

      border:
        1px solid var(--border);

      border-radius: 18px;

      background:
        rgba(255,255,255,0.025);

      transition: 0.25s ease;
    }

    .stat-card:hover {

      transform: translateY(-3px);

      border-color:
        rgba(99,102,241,0.25);
    }

    .stat-top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 13px;
    }

    .stat-card-icon {

      width: 37px;
      height: 37px;

      display: grid;

      place-items: center;

      border-radius: 11px;

      background:
        rgba(99,102,241,0.11);

      font-size: 16px;
    }

    .stat-change {

      color: var(--success);

      font-size: 9px;

      font-weight: 700;
    }

    .stat-card strong {

      display: block;

      font-size: 24px;

      margin-bottom: 2px;
    }

    .stat-card small {

      color: var(--muted);

      font-size: 10px;
    }


    /* =====================================================
       CONTENT GRID
    ===================================================== */

    .content-grid {

      display: grid;

      grid-template-columns:
        1.4fr 0.8fr;

      gap: 18px;

      margin-bottom: 20px;
    }


    /* =====================================================
       CARD
    ===================================================== */

    .card {

      border:
        1px solid var(--border);

      border-radius: 20px;

      background:
        rgba(255,255,255,0.025);

      overflow: hidden;
    }

    .card-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 20px 21px 15px;
    }

    .card-header h3 {

      font-size: 15px;

      margin-bottom: 3px;
    }

    .card-header p {

      color: var(--muted);

      font-size: 9px;
    }

    .view-all {

      color: var(--cyan);

      font-size: 10px;

      cursor: pointer;
    }


    /* =====================================================
       STUDY PLAN
    ===================================================== */

    .study-list {

      padding:
        0 15px 16px;
    }

    .study-item {

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 12px 7px;

      border-top:
        1px solid
        rgba(148,163,184,0.08);
    }

    .study-icon {

      width: 39px;
      height: 39px;

      flex-shrink: 0;

      display: grid;

      place-items: center;

      border-radius: 11px;

      background:
        rgba(99,102,241,0.10);

      font-size: 16px;
    }

    .study-info {

      min-width: 0;

      flex: 1;
    }

    .study-info strong {

      display: block;

      font-size: 11px;

      margin-bottom: 3px;
    }

    .study-info span {

      color: var(--muted);

      font-size: 9px;
    }

    .study-status {

      padding:
        5px 8px;

      border-radius: 8px;

      font-size: 8px;

      font-weight: 700;
    }

    .status-done {

      color: #86efac;

      background:
        rgba(34,197,94,0.10);
    }

    .status-current {

      color: #67e8f9;

      background:
        rgba(34,211,238,0.10);
    }

    .status-upcoming {

      color: var(--muted);

      background:
        rgba(255,255,255,0.04);
    }


    /* =====================================================
       PROGRESS
    ===================================================== */

    .progress-content {

      padding:
        0 21px 22px;
    }

    .progress-circle {

      width: 145px;
      height: 145px;

      border-radius: 50%;

      margin:
        8px auto 22px;

      display: grid;

      place-items: center;

      background:

        conic-gradient(
          var(--cyan) 0deg 281deg,
          rgba(255,255,255,0.06) 281deg 360deg
        );

      position: relative;
    }

    .progress-circle::after {

      content: "";

      position: absolute;

      inset: 10px;

      border-radius: 50%;

      background: #0b1020;
    }

    .progress-circle-content {

      position: relative;

      z-index: 2;

      text-align: center;
    }

    .progress-circle strong {

      display: block;

      font-size: 28px;
    }

    .progress-circle span {

      color: var(--muted);

      font-size: 9px;
    }

    .progress-details {

      display: grid;

      gap: 9px;
    }

    .progress-row {

      display: flex;

      justify-content: space-between;

      font-size: 10px;
    }

    .progress-row span:first-child {

      color: var(--muted);
    }

    .progress-row span:last-child {

      color: var(--text-soft);

      font-weight: 700;
    }


    /* =====================================================
       AI ASSISTANT
    ===================================================== */

    .ai-card-large {

      padding: 22px;

      border-radius: 20px;

      border:
        1px solid
        rgba(99,102,241,0.18);

      background:

        radial-gradient(
          circle at 90% 0%,
          rgba(99,102,241,0.15),
          transparent 35%
        ),

        linear-gradient(
          135deg,
          rgba(99,102,241,0.08),
          rgba(34,211,238,0.025)
        );
    }

    .ai-heading {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 18px;
    }

    .ai-avatar {

      width: 43px;
      height: 43px;

      display: grid;

      place-items: center;

      border-radius: 13px;

      background: var(--gradient);

      box-shadow:
        0 8px 25px
        rgba(99,102,241,0.25);

      font-size: 18px;
    }

    .ai-heading strong {

      display: block;

      font-size: 14px;

      margin-bottom: 2px;
    }

    .ai-heading span {

      color: var(--success);

      font-size: 9px;
    }

    .ai-message {

      padding: 13px;

      border-radius: 13px;

      background:
        rgba(255,255,255,0.035);

      border:
        1px solid var(--border);

      color: var(--text-soft);

      font-size: 10px;

      line-height: 1.9;

      margin-bottom: 13px;
    }

    .ai-suggestions {

      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 14px;
    }

    .suggestion {

      padding:
        7px 10px;

      border-radius: 9px;

      color: var(--text-soft);

      background:
        rgba(255,255,255,0.035);

      border:
        1px solid var(--border);

      font-size: 9px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .suggestion:hover {

      border-color:
        rgba(34,211,238,0.35);

      color: white;
    }

    .ai-input {

      display: flex;

      gap: 7px;
    }

    .ai-input input {

      flex: 1;

      min-width: 0;

      padding:
        10px 12px;

      border-radius: 11px;

      border:
        1px solid var(--border);

      background:
        rgba(0,0,0,0.18);

      color: white;

      outline: none;

      font-size: 10px;
    }

    .ai-input input:focus {

      border-color:
        rgba(99,102,241,0.5);
    }

    .ai-send {

      width: 39px;

      border-radius: 11px;

      background: var(--gradient);

      color: white;

      cursor: pointer;

      font-size: 13px;
    }


    /* =====================================================
       QUICK ACTIONS
    ===================================================== */

    .quick-actions {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;
    }

    .quick-action {

      padding: 18px;

      border-radius: 17px;

      border:
        1px solid var(--border);

      background:
        rgba(255,255,255,0.025);

      cursor: pointer;

      transition: 0.25s ease;
    }

    .quick-action:hover {

      transform: translateY(-4px);

      border-color:
        rgba(99,102,241,0.30);

      background:
        rgba(99,102,241,0.055);
    }

    .quick-icon {

      width: 38px;
      height: 38px;

      display: grid;

      place-items: center;

      border-radius: 11px;

      background:
        rgba(99,102,241,0.10);

      margin-bottom: 11px;

      font-size: 16px;
    }

    .quick-action strong {

      display: block;

      font-size: 11px;

      margin-bottom: 4px;
    }

    .quick-action span {

      color: var(--muted);

      font-size: 9px;

      line-height: 1.6;
    }


    /* =====================================================
       TOAST
    ===================================================== */

    .toast {

      position: fixed;

      bottom: 25px;

      left: 25px;

      padding:
        12px 16px;

      border-radius: 12px;

      background:
        #111827;

      border:
        1px solid var(--border);

      box-shadow: var(--shadow);

      color: var(--text-soft);

      font-size: 11px;

      transform:
        translateY(100px);

      opacity: 0;

      pointer-events: none;

      transition: 0.3s ease;

      z-index: 500;
